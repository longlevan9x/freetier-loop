services:
  freetier-loop:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    env_file:
      - .dev.vars
    environment:
      NODE_ENV: production
      PORT: "8787"
      SQLITE_PATH: /data/freetier-loop.sqlite
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8787}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set in environment}
      ADMIN_EMAILS: ${ADMIN_EMAILS:?ADMIN_EMAILS must be set in environment}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in environment}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY must be set in environment}
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:?VITE_TURNSTILE_SITE_KEY must be set in environment}
    volumes:
      - freetier_data:/data
    restart: unless-stopped

volumes:
  freetier_data:
